[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srishti Piplani", email = "16473038+srishti-piplani@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.4",
    "langgraph>=1.2.17",
    "pinecone>=7.3.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
